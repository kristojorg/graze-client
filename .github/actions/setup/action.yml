name: Setup
description: Install bun and node, then install dependencies with bun.
inputs:
  node-version:
    description: The version of Node.js to install
    required: true
    default: "24"

runs:
  using: composite
  steps:
    - name: Install bun
      uses: oven-sh/setup-bun@v2
    - name: Install node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
